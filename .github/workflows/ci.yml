name: offline-contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check:syntax
      - run: npm run check:release
      - run: bash scripts/install.sh --dry-run
      - run: bash scripts/prepare-dashboard.sh --dry-run
